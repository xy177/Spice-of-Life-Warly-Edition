plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
group = 'com.xy177.solwarly'
version = '1.0.0'
base { archivesName = 'solwarly-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    implementation "net.neoforged:neoforge:${providers.gradleProperty('neoforgeVersion').getOrElse('21.1.200')}"
    compileOnly 'maven.modrinth:u6dRKJwZ:zHNxmOqp'
    compileOnly 'maven.modrinth:emi:5sIPA1To'

    if (project.hasProperty('withCompat')) {
        runtimeOnly 'maven.modrinth:R2OftAxM:XTVZDOol'
        runtimeOnly 'maven.modrinth:u6dRKJwZ:zHNxmOqp'
    }
}
runs {
    configureEach {
        workingDirectory file("${providers.gradleProperty('runDirectory').getOrElse('E:/BOX/solwarly-runs/1.21.1')}/${name}")
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }
    client {}
    server { argument '--nogui' }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '500']
}
tasks.named('processResources').configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar').configure {
    from 'LICENSE.txt'
    manifest { attributes 'Implementation-Vendor': 'xy177' }
}
