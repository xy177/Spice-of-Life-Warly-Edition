plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
group = 'com.xy177.solwarly'
version = '1.0.0'
base { archivesName = 'solwarly-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory file("${providers.gradleProperty('runDirectory').getOrElse('E:/BOX/solwarly-runs/1.20.1')}/${name}")
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'solwarly'
            mods { solwarly { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {}
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    compileOnly fg.deobf('maven.modrinth:u6dRKJwZ:4vbuxppk')
    compileOnly fg.deobf('maven.modrinth:emi:Axuu9I9R')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    if (project.hasProperty('withCompat')) {
        runtimeOnly fg.deobf('maven.modrinth:R2OftAxM:SiIpcZzM')
        runtimeOnly fg.deobf('maven.modrinth:u6dRKJwZ:4vbuxppk')
    }
}
mixin {
    add sourceSets.main, 'solwarly.refmap.json'
    config 'solwarly.mixins.json'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '500']
}
tasks.named('processResources').configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar').configure {
    from 'LICENSE.txt'
    manifest { attributes 'Implementation-Vendor': 'xy177', 'MixinConfigs': 'solwarly.mixins.json' }
    finalizedBy 'reobfJar'
}
