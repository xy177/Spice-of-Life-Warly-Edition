// Prepared by xy177 on 2026-10-10 for Spice of Life Warly Edition (LGPL 2.1).
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

group = 'com.xy177.solwarly'
version = '1.0.0'
archivesBaseName = 'solwarly-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    version = '1.12.2-14.23.5.2836'
    mappings = 'stable_39'
    runDir = 'run'
}

repositories {
    mavenCentral()
    maven { url = 'https://www.ryanliptak.com/maven/' }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    deobfCompile 'applecore:AppleCore:1.12.2-3.2.0:deobf'
    deobfProvided 'mezz.jei:jei_1.12.2:4.16.1.1013:api'
    testRuntime 'mezz.jei:jei_1.12.2:4.16.1.1013:api'
    testCompile 'junit:junit:4.13.2'
    testCompile 'org.mockito:mockito-inline:2.28.2'
}

test {
    workingDir = file("$buildDir/test-runtime")
    doFirst { workingDir.mkdirs() }
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    from('LICENSE.txt')
    manifest {
        attributes 'Implementation-Title': 'Spice of Life Warly Edition',
                   'Implementation-Version': project.version,
                   'Implementation-Vendor': 'xy177'
    }
}

sourceJar {
    from 'LICENSE.txt'
}
